<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Моё Резюме</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      background: #0099ff;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .resume {
      padding: 40px;
      color: black;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .resume section, .resume header, .resume footer {
      margin-bottom: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .field-label {
      font-weight: bold;
      margin-bottom: 10px;
      display: block;
      color: #0099ff;
      font-size: 18px;
    }

    .field-input {
      display: block;
      width: 100%;
      min-height: 30px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 10px;
      background: white;
      color: black;
      text-align: center;
    }

    #downloadBtn {
      margin-top: 30px;
      padding: 12px 25px;
      background-color: #0099ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
    }

    #downloadBtn:hover {
      background-color: #0077cc;
      transform: translateY(-2px);
    }

    /* ВОЛНА */
    .wave {
      position: absolute;
      width: 100%;
      height: 120px;
      bottom: 0;
      left: 0;
      background: url('https://svgshare.com/i/uLZ.svg') repeat-x;
      background-size: contain;
      animation: waveMove 10s linear infinite;
      z-index: -1;
    }

    @keyframes waveMove {
      0% {
        background-position-x: 0;
      }
      100% {
        background-position-x: 1000px;
      }
    }

    header {
      border-bottom: 2px solid #0099ff;
      padding-bottom: 20px;
    }

    #name {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="resume">
    <!-- Имя и Фамилия -->
    <header>
      <span class="field-label">Имя Фамилия</span>
      <div class="field-input" contenteditable="true" id="name">Савенков Анатолий</div>
    </header>

    <!-- Краткая информация -->
    <section>
      <span class="field-label">Краткая информация о себе</span>
      <div class="field-input" contenteditable="true" id="summary">Frontend-разработчик</div>
    </section>

    <!-- Опыт работы -->
    <section>
      <span class="field-label">Опыт работы</span>
      <div class="field-input" contenteditable="true" id="experience">20 лет работы в Google</div>
    </section>

    <!-- Образование -->
    <section>
      <span class="field-label">Образование</span>
      <div class="field-input" contenteditable="true" id="education">2 Высших образования Oxford</div>
    </section>

    <!-- Контакты -->
    <footer>
      <span class="field-label">Контакты</span>
      <div class="field-input" contenteditable="true" id="contacts">+7 123 000 00 00</div>
    </footer>

    <button id="downloadBtn" class="ripple-target">Скачать PDF</button>
  </div>

  <!-- Волна -->
  <div class="wave"></div>

  <script src="script.js"></script>
</body>
</html>
