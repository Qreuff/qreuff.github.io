<!DOCTYPE html>
<div class="wave"></div>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Моё Резюме</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .resume section, .resume header, .resume footer {
      margin-bottom: 20px;
    }

    .field-label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }

    .field-input {
      display: block;
      width: 100%;
      min-height: 30px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="resume">
    <!-- Имя и Фамилия -->
    <header>
      <span class="field-label">Имя Фамилия</span>
      <div class="field-input" contenteditable="true" id="name">Савенков Анатолий</div>
    </header>

    <!-- Краткая информация -->
    <section>
      <span class="field-label">Краткая информация о себе</span>
      <div class="field-input" contenteditable="true" id="summary">Frontend-разработчик</div>
    </section>

    <!-- Опыт работы -->
    <section>
      <span class="field-label">Опыт работы</span>
      <div class="field-input" contenteditable="true" id="experience">20 лет работы в Google</div>
    </section>

    <!-- Образование -->
    <section>
      <span class="field-label">Образование</span>
      <div class="field-input" contenteditable="true" id="education">2 Высших образования Oxford</div>
    </section>

    <!-- Контакты -->
    <footer>
      <span class="field-label">Контакты</span>
      <div class="field-input" contenteditable="true" id="contacts">+7 123 000 00 00</div>
    </footer>

    <button id="downloadBtn" class="ripple-target">Скачать PDF</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
